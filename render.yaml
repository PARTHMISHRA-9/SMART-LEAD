services:
  # 1. Express Node.js Backend
  - type: web
    name: hoarding-leads-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # 2. FastAPI Python AI/ML Service
  - type: web
    name: hoarding-leads-python
    env: python
    plan: free
    rootDir: python_services
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  # 3. React Frontend Static Site (Static sites are free by default on Render, no plan field required)
  - type: web
    name: hoarding-leads-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
